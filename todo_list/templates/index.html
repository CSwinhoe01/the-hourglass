{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container">

  <!-- Header -->
  <div class="row align-items-center g-2 mt-3 mb-2">
    <div class="col-6">
      <h1 class="h1 mb-0">The Hourglass</h1>
    </div>
    <div class="col-6 text-end">
      {% if user.is_authenticated %}
      <button type="button" class="btn btn-sm btn-danger" data-bs-toggle="modal" data-bs-target="#logoutModal">Logout</button>
      {% endif %}
    </div>
  </div>

  <!-- Filters/Search row -->
  <div class="row g-2 mb-3">
    <div class="col-12 col-lg-8">
      <form class="d-flex flex-wrap align-items-end gap-2" method="get" action="{% url 'task_search' %}">
        <div class="flex-grow-1">
          <label for="q" class="form-label mb-1">Search</label>
          <input id="q" name="q" type="search" class="form-control form-control-sm" placeholder="Search tasks by title" value="{{ q }}">
        </div>
        <div>
          <label for="category" class="form-label mb-1">Category</label>
          <select id="category" name="category" class="form-select form-select-sm">
            <option value="">All</option>
            {% for c in categories %}
              <option value="{{ c.id }}" {% if selected_category|default:'' == c.id|stringformat:'s' %}selected{% endif %}>
                {{ c.name }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label for="sort" class="form-label mb-1">Sort</label>
          <select id="sort" name="sort" class="form-select form-select-sm">
            <option value="due_date" {% if sort_by == 'due_date' %}selected{% endif %}>Due date</option>
            <option value="title" {% if sort_by == 'title' %}selected{% endif %}>Title</option>
            <option value="status" {% if sort_by == 'status' %}selected{% endif %}>Status</option>
          </select>
        </div>
        <div class="ms-auto">
          <button class="btn btn-primary btn-sm" type="submit">Apply</button>
        </div>
      </form>
    </div>

    <!-- Right side actions need a flex context for justify-content-end -->
    <div class="col-12 col-lg-4">
      <div class="d-flex justify-content-end gap-2">
        {% if user.is_authenticated %}
          <a href="{% url 'task_create' %}" class="btn btn-success btn-sm">New Task</a>
        {% else %}
          <button type="button" class="btn btn-success btn-sm require-auth">New Task</button>
        {% endif %}
      </div>
    </div>
  </div>

  <!-- Tasks grid: use proper column wrappers and equal heights -->
  <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
    {% for task in tasks %}
    <div class="col">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">{{ task.title }}</h5>
         
        </div>
        <div class="card-footer bg-transparent">
         
        </div>
      </div>
    </div>
    {% empty %}
    <div class="col">
      <div class="alert alert-secondary mb-0">No tasks yet.</div>
    </div>
    {% endfor %}
  </div>

</div>

<!-- Keep your existing modals and scripts below -->
{% endblock %}
