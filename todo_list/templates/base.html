{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Hourglass</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  >

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- custom styles -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <div class="container">
    {% block content %}{% endblock %}
  </div>

  <!-- Top-right toast container -->
  <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1080"></div>

  <!-- Bootstrap bundle (required for toasts/modals) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    // Simple toast helper
    window.showToast = function (msg, level) {
      const container = document.getElementById('toast-container');
      if (!container || typeof bootstrap === 'undefined' || !bootstrap.Toast) return;
      const el = document.createElement('div');
      el.className = 'toast align-items-center text-bg-' + (level || 'info') + ' border-0';
      el.setAttribute('role', 'alert');
      el.setAttribute('aria-live', 'assertive');
      el.setAttribute('aria-atomic', 'true');
      el.dataset.bsDelay = '3500';
      el.innerHTML = '<div class="d-flex"><div class="toast-body"></div><button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div>';
      el.querySelector('.toast-body').textContent = msg;
      container.appendChild(el);
      const t = new bootstrap.Toast(el);
      el.addEventListener('hidden.bs.toast', () => el.remove());
      t.show();
    };
  </script>

  {% if messages %}
  <script type="text/javascript">
    // Show Django messages as toasts after redirect
    document.addEventListener('DOMContentLoaded', function () {
        {% for message in messages %}
          showToast("{{ message|escapejs }}", "{{ message.tags|default:'info' }}");
        {% endfor %}
    });
  </script>
  {% endif %}
</body>
</html>
